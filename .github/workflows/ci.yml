name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@633a5545fcfec91b688840650d4edf3e9cc1abbd # v2026.10
    with:
      runtime-version: "1.4.0"
      node-version: "26.12.1"
      install-policy: blocked
      coverage-path: coverage
      test-command: bun run test:coverage
      build: true
      build-command: bun run build

  browser-e2e:
    name: L3 Browser E2E
    needs: quality
    uses: nocoo/base-ci/.github/workflows/test-job.yml@633a5545fcfec91b688840650d4edf3e9cc1abbd # v2026.10
    with:
      runtime: bun
      runtime-version: "1.4.0"
      node-version: "26.12.1"
      install-policy: blocked
      timeout-minutes: 20
      pre-command: |
        bun run build
        bunx playwright install --with-deps chromium webkit
      command: bun run test:e2e
      env-json: '{"WRANGLER_SEND_METRICS": "false", "CI": "true"}'
      artifact-name: browser-evidence
      artifact-path: |
        playwright-report/
        test-results/
        artifacts/playwright-results.json
      artifact-retention-days: 14

  workflow-lint:
    uses: nocoo/base-ci/.github/workflows/workflow-lint.yml@633a5545fcfec91b688840650d4edf3e9cc1abbd # v2026.10
    with:
      required-reusable-workflow: nocoo/base-ci/.github/workflows/deploy-worker.yml
      yamllint: true
