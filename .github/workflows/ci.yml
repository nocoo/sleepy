# CI slot standard v1 (nocoo/base-ci docs/slots.md): S1, S2, S3, G1, G2, B1, L1, L3, Z1 via quality.yml;
# L1.5, L2, P1 declared na in slot-status.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@272dfa9fa21f6f1ddee534470cc5d618793147d7 # v2026.11
    with:
      runtime-version: "1.4.0"
      node-version: "26.12.1"
      install-policy: blocked
      coverage-path: coverage
      test-command: bun run test:coverage
      osv-config: osv-scanner.toml
      gitleaks-config: .gitleaks.toml
      build: true
      build-command: bun run build
      workflow-lint: true
      workflow-lint-required-workflow: nocoo/base-ci/.github/workflows/deploy-worker.yml
      workflow-lint-yamllint: true
      l3: true
      l3-browser: ""
      l3-command: |
        bun run build
        bunx playwright install --with-deps chromium webkit
        bun run test:e2e
      env-json: '{"WRANGLER_SEND_METRICS": "false", "CI": "true"}'
      slot-status: >-
        {"S1": {"status": "impl"},
        "S2": {"status": "impl"},
        "S3": {"status": "impl"},
        "G1": {"status": "impl"},
        "G2": {"status": "impl"},
        "B1": {"status": "impl"},
        "L1": {"status": "impl"},
        "L1.5": {"status": "na", "reason": "无 @cloudflare/vitest-pool-workers / miniflare Worker 运行时测试套件"},
        "L2": {"status": "na", "reason": "无对外 HTTP API E2E；Worker 仅提供静态 dist"},
        "L3": {"status": "impl"},
        "P1": {"status": "na", "reason": "package.json 为 private，不发布 npm 包"},
        "Z1": {"status": "impl"}}
